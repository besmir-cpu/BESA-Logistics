name: Operations frontend checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'besa-theme.css'
      - 'onboard.html'
      - 'design/**'
      - '.github/workflows/operations-frontend.yml'
      - 'rota.html'
      - 'rota/**'
      - 'operations/**'
      - 'payments.html'
      - 'payment-tracker.html'
      - 'recruitment.html'
      - 'recruitment/**'
      - 'driver-journey/**'
      - 'supabase/migrations/002_driver_journey_optional.sql'
      - 'payments/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'besa-theme.css'
      - 'onboard.html'
      - 'design/**'
      - '.github/workflows/operations-frontend.yml'
      - 'rota.html'
      - 'rota/**'
      - 'operations/**'
      - 'payments.html'
      - 'payment-tracker.html'
      - 'recruitment.html'
      - 'recruitment/**'
      - 'driver-journey/**'
      - 'supabase/migrations/002_driver_journey_optional.sql'
      - 'payments/**'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check core website syntax
        run: node --check app.js
      - name: Check rota scripts
        run: |
          node --input-type=module --check < rota/preview-v2.js
          node --input-type=module --check < rota/van-allocation.js
          node --input-type=module --check < rota/rules.mjs
      - name: Check Work Summary import script
        run: node --input-type=module --check < payments/summary.js
      - name: Check payment tracker syntax
        run: node --input-type=module --check < payments/tracker.js
      - name: Test Google payment tracker import
        run: node --test payments/tracker.test.mjs
      - name: Test Horizon design consistency and accessibility
        run: node --test design/theme.test.mjs
      - name: Check recruitment administration module
        run: |
          node --input-type=module --check < recruitment/office.js
          node --test recruitment/rules.test.mjs
      - name: Check unified Drivers profile and privacy
        run: |
          node --input-type=module --check < driver-journey/office.js
          node --test driver-journey/profile.test.mjs
          node --test driver-journey/tracker-rules.test.mjs
      - name: Check sidebar navigation stays available
        run: |
          node --check operations/sidebar.js
          node --test operations/sidebar.test.mjs
      - name: Confirm normal website workspaces exist
        run: |
          test -f rota.html
          test -f payments.html
          test -f payment-tracker.html
          test -f recruitment.html
          grep -q 'href="rota.html"' index.html
          grep -q 'href="rota.html#vans"' index.html
          grep -q 'href="payments.html"' index.html
          grep -q 'href="payment-tracker.html"' index.html
          grep -q 'href="#drivers" data-page="drivers"' index.html
          grep -q 'id="driver-profile"' index.html
