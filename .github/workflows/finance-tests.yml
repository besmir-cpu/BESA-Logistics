name: Finance calculation tests
on:
  pull_request:
    paths:
      - 'finance/**'
      - '.github/workflows/finance-tests.yml'
  push:
    branches:
      - 'development/verion-foundation'
    paths:
      - 'finance/**'
      - '.github/workflows/finance-tests.yml'
permissions:
  contents: read
jobs:
  calculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test draft-only invoice totals
        run: node --test finance/*.test.mjs
