name: Verify BESA no-email trial is live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-trial-publish.yml'
      - 'index.html'
      - 'app.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm public BESA Netlify office trial is available
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" expected="$2" file="$3"
            local code
            code=$(curl -sSL --retry 2 --max-time 25 -o "$file" -w '%{http_code}' "$url")
            echo "Checked URL path: ${url%%\\?*}; HTTP $code"
            test "$code" = '200'
            grep -q "$expected" "$file"
            echo "Required release marker present: $expected"
          }
          fetch 'https://besalogistics.co.uk/office/' 'trial-enter' /tmp/besa-office-home.html
          fetch 'https://besalogistics.co.uk/office/app.js?v=trial-preview-20261019' 'function enterTrial()' /tmp/besa-office-app.js
          fetch 'https://besmir-cpu.github.io/BESA-Logistics/index.html' 'trial-enter' /tmp/besa-ghpages.html
          echo 'Public trial ready; no applicant or production database records fetched.'
