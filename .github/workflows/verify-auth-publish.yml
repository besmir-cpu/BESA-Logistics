name: Verify BESA staff workspace publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-auth-publish.yml'
      - 'scripts/verify-office-publish.mjs'
      - 'app.js'
      - 'index.html'
      - 'operations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify staff login and dashboard release after Pages propagation
        run: node scripts/verify-office-publish.mjs
