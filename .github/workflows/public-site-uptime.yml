name: BESA public site uptime
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check four public office shells (never private records)
        shell: bash
        run: |
          set -euo pipefail
          base="https://besmir-cpu.github.io/BESA-Logistics"
          for path in index.html rota.html payments.html payment-tracker.html; do
            echo "Checking public ${path}"
            curl --fail --silent --show-error --location --retry 2 --max-time 20 \
              --output /tmp/besa-page.html \
              --write-out "HTTP %{http_code}; response %{time_total}s; bytes %{size_download}\n" \
              "${base}/${path}"
            if ! grep -qi "BESA" /tmp/besa-page.html; then
              echo "::error::Unexpected site content at ${path}"
              exit 1
            fi
          done
          echo "Public site checks passed; no database or personal-data requests made."
      - name: Verify live company homepage and licensed photos
        shell: bash
        run: |
          set -euo pipefail
          base="https://besalogistics.co.uk"
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$base/" -o /tmp/besa-company.html
          grep -q 'UK FINAL-MILE DELIVERY CARRIER' /tmp/besa-company.html
          grep -q 'official Amazon Delivery Service Partner' /tmp/besa-company.html
          for image in parcel-handover doorstep-delivery; do
            curl --fail --silent --show-error --location --max-time 20 "$base/images/$image.jpg" -o /tmp/besa-photo.jpg
            test "$(wc -c < /tmp/besa-photo.jpg)" -gt 10000
          done
