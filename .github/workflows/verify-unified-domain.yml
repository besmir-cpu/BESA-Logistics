name: Verify BESA unified Netlify domain
on:
  pull_request:
    paths:
      - '.github/workflows/verify-unified-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Validate real public Netlify routes
        shell: bash
        run: |
          set -u
          check() {
            local url="$1";local expected="$2"
            local out=/tmp/besa-public-page
            code=$(curl -sSL --retry 1 --connect-timeout 12 --max-time 22 -o "$out" -w '%{http_code}' "$url")
            echo "PAGE: $url HTTP $code bytes $(wc -c < "$out")"
            if [ "$code" = 200 ] && grep -qi "$expected" "$out"; then echo "CONTENT OK: $expected"; else echo "::error::Page failed for $url (expected $expected)"; return 1; fi
          }
          rc=0
          check https://besalogistics.co.uk/ 'BESA' || rc=1
          check https://besalogistics.co.uk/onboarding/ 'candidate-form' || rc=1
          check https://besalogistics.co.uk/onboarding/candidate-onboarding.js 'candidate' || rc=1
          check https://besalogistics.co.uk/office/ 'login-screen' || rc=1
          check https://besalogistics.co.uk/office/app.js 'renderActiveView' || rc=1
          check https://besalogistics.co.uk/office/rota.html 'Rota' || rc=1
          echo "Final website verification status: $rc"
          exit "$rc"
      - name: Diagnose published homepage and Netlify response
        if: always()
        shell: bash
        run: |
          set -u
          curl --fail --silent --show-error --location --max-time 20 https://besalogistics.co.uk/ -o /tmp/current-besa-home
          echo "Live homepage bytes: $(wc -c </tmp/current-besa-home)"
          echo 'Published site version markers:'
          grep -Eo 'Team portal|Staff team portal|Office login|Staff login|onboarding/|netlify' /tmp/current-besa-home | sort | uniq -c | head -20 || true
          echo 'Current onboarding response headers:'
          curl --silent --show-error --max-time 20 -D /tmp/onboard-header -o /tmp/onboard-body https://besalogistics.co.uk/onboarding/
          grep -Ei '^HTTP/|^server:|^x-nf-request-id:|^location:|^content-type:' /tmp/onboard-header || true
          echo 'Current office response headers:'
          curl --silent --show-error --max-time 20 -D /tmp/office-header -o /tmp/office-body https://besalogistics.co.uk/office/
          grep -Ei '^HTTP/|^server:|^x-nf-request-id:|^location:|^content-type:' /tmp/office-header || true
          echo 'Main domain current version check complete.'
      - name: Check current onboarding server CORS
        if: always()
        shell: bash
        run: |
          for origin in https://besalogistics.co.uk https://besmir-cpu.github.io; do
            echo "CORS check: $origin"
            curl -sS -D /tmp/besa-cors-headers -o /dev/null -X OPTIONS \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' \
              --retry 1 --max-time 20 \
              'https://xyicnwfwsmbfcputqrbn.supabase.co/functions/v1/besa-candidate-intake' || true
            grep -Ei '^HTTP/|^access-control-allow-origin:|^access-control-allow-methods:' /tmp/besa-cors-headers || true
          done
