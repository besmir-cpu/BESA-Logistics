<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Besa Logistics Â· Secure Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">Besa Logistics</h1>

  <!-- Login / Invite section -->
  <form id="auth-section" onsubmit="login(event)" class="bg-white p-6 rounded-xl border mb-6">
    <h2 class="font-semibold mb-4">Admin Login</h2>
    <label for="email" class="block text-sm mb-2">Admin email</label>
    <input id="email" type="email" required autocomplete="email" placeholder="Your email" class="w-full border rounded px-3 py-2 mb-3">
    <button id="login-button" type="submit" class="bg-slate-900 text-white px-4 py-2 rounded">Send magic link</button>
    <div id="auth-status" role="status" aria-live="polite" class="text-sm mt-3 text-slate-600"></div>
  </form>

  <div id="admin-section" class="hidden bg-white p-6 rounded-xl border">
    <h2 class="font-semibold mb-4">Invite new driver</h2>
    <div class="flex gap-2 mb-4">
      <input id="invite-email" type="email" placeholder="Driver email" class="flex-1 border rounded px-3 py-2">
      <button onclick="inviteDriver()" class="bg-emerald-600 text-white px-4 py-2 rounded">Send invite</button>
    </div>
    <div id="invite-status" class="text-sm text-slate-600"></div>

    <h3 class="font-medium mt-6 mb-2">Recent applications</h3>
    <div id="drivers-list" class="text-sm"></div>
  </div>
</div>

<script src="config.js?v=login-fix-20261015"></script>
<script>
async function login(event) {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const status = document.getElementById('auth-status');
  const button = document.getElementById('login-button');
  button.disabled = true;
  status.textContent = 'Sending login link…';
  try {
    const { error } = await besaClient.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: new URL('index.html', window.location.href).href }
    });
    if (error) throw error;
    status.textContent = 'Check your email for the login link (including your spam folder).';
  } catch (error) {
    status.textContent = error.message || 'Unable to send the login link. Please try again.';
  } finally {
    button.disabled = false;
  }
}

async function inviteDriver() {
  const email = document.getElementById('invite-email').value;
  if (!email) return;
  // Create driver record then send magic link / invite
  const { error: dbError } = await besaClient.from('drivers').insert({ email, status: 'invited' });
  if (dbError) {
    document.getElementById('invite-status').textContent = dbError.message;
    return;
  }
  const { error } = await besaClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: new URL('onboard.html', window.location.href).href }
  });
  document.getElementById('invite-status').textContent = error ? error.message : 'Invite sent to ' + email;
  loadDrivers();
}

async function loadDrivers() {
  const { data } = await besaClient.from('drivers').select('*').order('created_at', { ascending: false }).limit(20);
  document.getElementById('drivers-list').innerHTML = (data || []).map(d => 
    `<div class="py-2 border-b">${d.email} â€” <span class="text-slate-500">${d.status}</span></div>`
  ).join('') || 'No applications yet';
}

besaClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('admin-section').classList.remove('hidden');
    setTimeout(loadDrivers, 0);
  } else {
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('admin-section').classList.add('hidden');
  }
});
</script>
</body>
</html>
