<form action="/thanks" id="contact-form" method="POST" name="besa-contact" data-netlify="true" netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="besa-contact">
            <p class="honeypot"><label>Do not fill this in: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
            <div class="contact-fields"><label>Your name <span aria-hidden="true">*</span><input type="text" name="name" autocomplete="name" required maxlength="100" placeholder="Your full name"></label><label>Email address <span aria-hidden="true">*</span><input type="email" name="email" autocomplete="email" required maxlength="180" placeholder="you@example.com"></label><label class="field-wide">I'm interested in <span aria-hidden="true">*</span><select name="interest" id="contact-interest" required><option value="">Please select</option><option value="Logistics enquiry">Logistics enquiry</option><option value="Driver opportunities">Driver opportunities</option><option value="General enquiry">General enquiry</option></select></label><label class="field-wide">Your message <span aria-hidden="true">*</span><textarea name="message" rows="4" required maxlength="2000" placeholder="How can we help?"></textarea></label></div>
            <p class="form-note">Please don't include passport images, driving licence numbers, bank details or other sensitive documents here. This form is for general enquiries only.</p>
            <button class="button button-primary form-submit" type="submit">Send message <span aria-hidden="true">↗</span></button>
          </form>
